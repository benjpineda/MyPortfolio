<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <title>Benjamin Hector C. Pineda | Portfolio</title>
  <link rel='stylesheet' href='style.css' />
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css' />
</head>
<body>
    <header class='site-header'>
    <nav>
      <div class='logo'>Benjamin Hector C. Pineda</div>
      <ul class='nav-links'>
        <li><a href='index.html#home'>Home</a></li>
        <li><a href='experience.html'>Experience</a></li>
        <li><a href='projects.html'>Projects</a></li>
        <li><a href='certifications.html'>Certifications</a></li>
        <li><a href='contact.html'>Contact</a></li>
      </ul>
    </nav>
  </header>

  <section id='experience'>
    <div class='section__text'>
      <h1 class='title'>Experience</h1>
      <p class='section__text__p2'>
        Here are the technologies and tools I have experience working with in front-end development.
      </p>
    </div>
    <div class='experience-container'>
      <h3>Frontend Development</h3>
      <div class='experience-list'>
        <div class='experience-item'>
          <img src='./assets/experience.png' class='icon small-icon' alt='HTML icon' />
          <div>
            <strong>HTML</strong>
            <p>Experienced</p>
          </div>
        </div>
        <div class='experience-item'>
          <img src='./assets/experience.png' class='icon small-icon' alt='CSS icon' />
          <div>
            <strong>CSS</strong>
            <p>Experienced</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();
    
    // Highlight current page nav link
    const currentPage = window.location.pathname.split('/').pop();
    const navLinks = document.querySelectorAll('.nav-links a');
    
    navLinks.forEach(link => {
      if (link.getAttribute('href') === currentPage) {
        link.classList.add('active');
      }
    });
  </script>
</body>
</html>
